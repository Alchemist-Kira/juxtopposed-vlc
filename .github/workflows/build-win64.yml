name: Build VLC Windows x64

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    name: Build Windows x64 Installer and ZIP
    runs-on: ubuntu-latest
    container:
      image: registry.videolan.org/vlc-debian-win64-posix:20260611225331
      options: --user root

    steps:
      - name: Fix runner file permissions
        shell: bash
        run: |
          chmod -R 777 /__w/_temp || true

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Mark workspace directory as safe in git
        shell: bash
        run: |
          git config --global --add safe.directory '*'

      - name: Compile and package VLC Win64
        shell: bash
        run: |
          set -e
          # Use verified prebuilt contrib dependencies from VideoLAN artifacts server
          export VLC_PREBUILT_CONTRIBS_URL="https://artifacts.videolan.org/vlc/win64/vlc-contrib-x86_64-w64-mingw32-8715c6fd8db923df82b460ae65d06d04e2dce51a.tar.zst"
          # Compile VLC for 64-bit Windows using prebuilt contrib packages (-p),
          # in release mode (-r), generating full installer and portable archives (-i r).
          extras/package/win32/build.sh -a x86_64 -p -r -i r

      - name: Upload Windows x64 packages
        uses: actions/upload-artifact@v4
        with:
          name: vlc-juxtopposed-windows-x64
          path: |
            win64/vlc-*-win64.exe
            win64/vlc-*-win64.zip
            win64/vlc-*-win64.7z
          if-no-files-found: warn
